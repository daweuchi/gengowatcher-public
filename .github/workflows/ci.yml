# Self-contained CI for the public snapshot. Mirrors the job logic of the
# org's shared CI baseline (pinned actions, sha256-verified gitleaks binary)
# without calling a private reusable workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION='8.30.1'
          GITLEAKS_SHA256='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan commits
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            /tmp/gitleaks detect --source . --config .gitleaks.toml \
              --log-opts '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}' \
              --verbose --redact
          else
            /tmp/gitleaks detect --source . --config .gitleaks.toml \
              --verbose --redact
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Collect changed files vs base
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'pull_request' ]; then
            BASE='${{ github.event.pull_request.base.sha }}'
          else
            BASE='${{ github.event.before }}'
          fi
          if [ -z "$BASE" ] || [ "$BASE" = '0000000000000000000000000000000000000000' ] \
            || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD | head -n 1)"
          fi
          git diff --name-only "$BASE" HEAD -- > /tmp/changed.txt
          grep -E '\.py$' /tmp/changed.txt > /tmp/changed-py.txt || true
          echo "changed files: $(wc -l < /tmp/changed.txt), python: $(wc -l < /tmp/changed-py.txt)"

      - name: Set up Python for lint
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint changed Python files
        run: |
          set -euo pipefail
          if [ ! -s /tmp/changed-py.txt ]; then
            echo "No changed Python files; skipping."
            exit 0
          fi
          pip install black ruff
          # Only lint files that still exist in the working tree.
          EXISTING="$(grep -Fxf <(git ls-files) /tmp/changed-py.txt || true)"
          if [ -z "$EXISTING" ]; then
            echo "No changed Python files remain; skipping."
            exit 0
          fi
          echo "$EXISTING" | xargs black --check
          echo "$EXISTING" | xargs ruff check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          uv sync --frozen --all-extras --python "${PYTHON_VERSION}"
          uv pip install -r requirements-dev.txt

      - name: Run tests
        run: uv run --no-sync python -m pytest -q
